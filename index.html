<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dixit's Spotify</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      href="https://fonts.fontshare.com/css?f[]=satoshi&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <main>
      <input type="radio" name="main-nav" id="tab-1" hidden />
      <input type="radio" name="main-nav" id="tab-2" />
      <input type="radio" name="main-nav" id="tab-3" />
      <input type="radio" name="main-nav" id="tab-4" />
      <input type="radio" name="main-nav" id="tab-5" />
      <section id="home" class="home"></section>
      <section id="discover" class="discover"></section>
      <section id="search" class="search"></section>
      <section id="library" class="library"></section>
      <section id="profile" class="profile"></section>
    </main>
    <footer>
      <input type="checkbox" id="toggle-player" class="player-checkbox" />
      <input type="checkbox" name="footer-icon" id="icon-add" hidden />
      <input type="checkbox" name="footer-icon" id="icon-play" hidden />
      <input type="checkbox" name="footer-icon" id="icon-like" hidden />
      <input type="checkbox" name="footer-icon" id="icon-added" hidden />

      <section class="mini-player">
        <label for="toggle-player" class="mini-player__wrapper">
          <figure class="mini-player__album">
            <img
              src="./assets/images/Daft Punk - Get Lucky.png"
              alt="Daft Punk - Random Access Memories"
            />

            <figcaption class="mini-player__track">
              <header class="mini-player__title-shell">
                <span class="mini-player__title">
                  Get Lucky (feat. Pharrell Williams and Nile Rodgers)
                </span>
              </header>
              <address class="mini-player__artist">Daft Punk</address>
            </figcaption>
          </figure>

          <section class="mini-player__controls">
            <button
              type="button"
              aria-label="Play/Pause"
              class="mini-player__button"
            >
              <figure>
                <label for="icon-add">
                  <img
                    src="./assets/icons/add.svg"
                    class="icon-outline"
                    alt="Add Icon"
                  />
                  <img
                    src="./assets/icons/added.svg"
                    class="icon-filled"
                    alt="Checked"
                  />
                </label>
                <label for="icon-play">
                  <img
                    src="./assets/icons/player.svg"
                    class="icon-outline icon-play"
                    alt="Play Icon"
                  />
                  <img
                    src="./assets/icons/paused.svg"
                    class="icon-filled"
                    alt="Pause Icon"
                  />
                </label>
              </figure>
            </button>
          </section>
        </label>
      </section>

      <section class="player-panel" aria-label="Expanded player">
        <aside class="player-panel__backdrop">
          <label
            for="toggle-player"
            class="player-panel__backdrop-close"
            aria-label="Close player"
          ></label>
        </aside>

        <article class="player-panel__sheet">
          <header class="panel-header">
            <label
              for="toggle-player"
              class="panel-header__handle"
              aria-label="Close player"
            ></label>
          </header>

          <section class="content">
            <figure class="content__album">
              <img
                src="./assets/images/Daft Punk - Get Lucky.png"
                alt="Daft Punk - Random Access Memories"
              />
              <figcaption class="track-info">
                <header class="track-info__title-shell">
                  <span class="track-info__title">
                    Get Lucky (feat. Pharrell Williams and Nile Rodgers)
                  </span>
                </header>
                <address class="track-info__artist">Daft Punk</address>
              </figcaption>
            </figure>
            <section class="controls">
              <figure class="controls__icon">
                <label for="icon-like" class="controls__label">
                  <img
                    src="./assets/icons/like.svg"
                    class="icon-outline like-icon"
                    alt="Like Icon"
                    aria-hidden="true"
                  />
                  <img
                    src="./assets/icons/liked.svg"
                    class="icon-filled"
                    alt="Like Icon"
                  />
                </label>
                <label for="icon-added" class="controls__label">
                  <img
                    src="./assets/icons/add.svg"
                    class="icon-outline"
                    alt="Add Icon"
                  />
                  <img
                    src="./assets/icons/added.svg"
                    class="icon-filled"
                    alt="Checked"
                  />
                </label>
              </figure>

              <section
                class="playback-control"
                aria-label="Media Playback Slider"
              >
                <input
                  type="range"
                  min="0"
                  max="100"
                  value="70"
                  class="progress-bar"
                  id="playback-slider"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="70"
                />
                <div class="slider-wrapper">
                  <time datetime="PT2M23S" class="current-time">2:23</time>

                  <time datetime="PT45S" class="remaining-time">-0:45</time>
                </div>
              </section>
            </section>
          </section>

          <section class="player-controls">
            <figure class="player-controls__container">
              <div class="player-controls__shuffle">
                <img
                  src="./assets/icons/shuffle.svg"
                  alt="Shuffle"
                  class="control-icon"
                />
              </div>
              <div class="player-controls__prev">
                <img
                  src="./assets/icons/previous.svg"
                  alt="Previous"
                  class="control-icon"
                />
              </div>

              <div class="player-controls__pause">
                <img
                  src="./assets/icons/pause.svg"
                  alt="Pause"
                  class="main-control"
                />
              </div>

              <div class="player-controls__next">
                <img
                  src="./assets/icons/next.svg"
                  alt="Next"
                  class="control-icon"
                />
              </div>
              <div class="player-controls__repeat">
                <img
                  src="./assets/icons/repeat.svg"
                  alt="Repeat"
                  class="control-icon"
                />
              </div>
            </figure>
          </section>
        </article>
      </section>

      <!-- Footer Navigation -->
      <nav class="footer-nav">
        <label for="tab-1">
          <figure>
            <img
              class="icon icon-outline"
              src="./assets/icons/home.svg"
              alt="Home Icon"
            />
            <img
              class="icon icon-filled"
              src="./assets/icons/home-filled.svg"
              alt="Home Icon"
            />
            <figcaption class="caption">Home</figcaption>
          </figure>
        </label>
        <label for="tab-2">
          <figure>
            <img
              class="icon icon-outline"
              src="./assets/icons/discover.svg"
              alt="Discover Icon"
            />
            <img
              class="icon icon-filled"
              src="./assets/icons/discover-filled.svg"
              alt="Discover Icon"
            />
            <figcaption class="caption">Discover</figcaption>
          </figure>
        </label>
        <label for="tab-3">
          <figure>
            <img
              class="icon icon-outline"
              src="./assets/icons/search.svg"
              alt="Search Icon"
            />
            <img
              class="icon icon-filled"
              src="./assets/icons/search-filled.svg"
              alt="Search Icon"
            />
            <figcaption class="caption">Search</figcaption>
          </figure>
        </label>
        <label for="tab-4">
          <figure>
            <img
              class="icon icon-outline"
              src="./assets/icons/library.svg"
              alt="Library Icon"
            />
            <img
              class="icon icon-filled"
              src="./assets/icons/library-filled.svg"
              alt="Library Icon"
            />
            <figcaption class="caption">Library</figcaption>
          </figure>
        </label>
        <label for="tab-5">
          <figure>
            <img
              class="icon icon-outline"
              src="./assets/icons/profile.svg"
              alt="Profile Icon"
            />
            <img
              class="icon icon-filled"
              src="./assets/icons/profile-filled.svg"
              alt="Profile Icon"
            />
            <figcaption class="caption">Me</figcaption>
          </figure>
        </label>
      </nav>
    </footer>
  </body>
</html>
